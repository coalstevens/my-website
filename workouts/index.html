<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training — Cole Stevens</title>
<link rel="icon" type="image/png" href="../assets/icons/favicon.png">
<script src="../assets/js/theme.js"></script>
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/theme.css">
<script src="js/plate-planner.js" defer></script>
<script src="js/session-archive.js" defer></script>
<script src="js/exercise-fields.js" defer></script>
<script src="js/history-analysis.js" defer></script>
<script src="../assets/js/page-navigation.js?v=2" defer></script>
<script src="js/archive-motion.js" defer></script>
<script src="js/archive-feedback.js" defer></script>
<script src="js/app.js" defer></script>
<script type="module" src="js/firebase-sync.js"></script>
</head>
<body>
<main>
<nav class="page-navigation" aria-label="Page navigation">
<a class="portfolio-link" href="/" data-zoom="in">← portfolio</a>
<div class="navigation-tools"><div class="account-actions" aria-label="Account"><button type="button" id="cloud-signin">sign in with Google</button><span id="cloud-account"></span><button type="button" id="cloud-signout" hidden>sign out</button></div><button type="button" id="cloud-export" aria-label="Download workouts as CSV" title="Download workouts as CSV"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></svg></button><div class="theme-toggle">
<input type="checkbox" id="theme-toggle" class="theme-toggle-input" aria-label="Use paper theme">
<label for="theme-toggle" class="theme-toggle-label">
<span class="theme-toggle-icon sun" aria-hidden="true">☾</span>
<span class="theme-toggle-icon moon" aria-hidden="true">☼</span>
</label>
</div></div>
</nav>
<section class="intro"><div><h1 id="page-title">Back to work.</h1><p id="page-subtitle" class="muted">Same foundation. A little further.</p></div></section>
<div class="session-heading"><div class="date-control"><span id="date-display" aria-hidden="true"></span><input id="date" type="date" aria-label="Workout date"></div><div class="cloud-actions"><span id="cloud-status" role="status">Demo · sign in to save your own workouts.</span><button type="button" id="cloud-retry" hidden>retry connection</button><button type="button" id="cloud-resolve" hidden>use latest cloud version</button><button type="button" id="demo-reset">reset demo</button></div><span id="save-status" role="status" hidden></span></div>
<fieldset id="workout-content" aria-label="Workout log">
<div class="layout"><section class="session">
<div id="exercises"></div>
<label class="notes-label" for="notes">SESSION NOTES</label><textarea id="notes" placeholder="How did it feel? Anything to remember?"></textarea>
<div class="archive-actions">
<button type="button" id="push-archive" aria-expanded="false" aria-controls="archive-confirm">push to archive</button>
<div id="archive-confirm" class="archive-confirm" hidden role="group" aria-label="Confirm archive"><span>archive this session and start a fresh workout?</span><button type="button" id="archive-yes">yes</button><button type="button" id="archive-no">no</button></div>
<span id="archive-action-status" role="status"></span>
</div>
</section>
<aside>
<section class="panel last-session" aria-labelledby="last-session-title"><h2 id="last-session-title">last session</h2><div class="last-session-entry"><span id="last-session-date"></span><span id="last-session-notes" aria-live="polite"></span></div></section>
<section class="panel current-analysis" aria-labelledby="current-analysis-title">
<h2 id="current-analysis-title">the long view</h2>
<div id="current-exercise-stats"><p>loading history…</p></div>
<a class="zoom-link" href="analysis.html" data-zoom="out">detailed analysis ↗</a>
</section>
<section class="panel"><h2>Plate helper</h2>
<div class="two-col"><label>Target total<input id="target" type="number" min="0" step="0.5" value="175"></label><label>Bar weight<input id="bar" type="number" min="0" step="0.5" value="45"></label></div>
<details><summary>Available equipment</summary><div id="equipment"></div></details>
<div id="plate-result" aria-live="polite"></div>
</section>
</aside></div>
<section id="history" class="history" aria-labelledby="history-title">
<div class="history-heading"><h2 id="history-title">workout archive</h2><span id="history-status" role="status">loading history…</span></div>
<div class="archive-carousel-nav" aria-label="Archive navigation"><button type="button" id="archive-newer" aria-label="Show newer session">← newer</button><form id="archive-jump" class="archive-page-control"><input id="archive-page" type="text" inputmode="numeric" pattern="[0-9]*" aria-label="Archive page number" title="Enter a page number and press Enter to jump" autocomplete="off"><span id="archive-total"></span><span id="archive-position" class="sr-only" role="status" aria-live="polite"></span></form><button type="button" id="archive-older" aria-label="Show older session">older →</button></div>
<div class="archive-stage"><div id="archive-peeks" class="archive-peeks" aria-label="Nearby archived sessions"></div><div id="history-workouts" class="archive-carousel" role="region" aria-roledescription="carousel" aria-label="Archived sessions" tabindex="0"></div></div>
<div id="archive-card-actions" class="archive-card-actions" hidden><button type="button" data-edit-archive aria-expanded="false" aria-label="Edit archived workout" title="Edit archived workout">edit</button><button type="button" data-delete-archived>delete</button><button type="button" data-copy-format>copy format to current workout</button></div>
</section>
</fieldset>
</main>
</body>
</html>
